<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Generator - GitHub Pages</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .meme-container {
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            padding: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .meme-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            overflow: hidden;
            border-radius: 8px;
        }
        .meme-image {
            width: 100%;
            height: auto;
            display: block;
        }
        .meme-text {
            position: absolute;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: white;
            -webkit-text-stroke: 1.5px black;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.9);
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 0 10px;
            box-sizing: border-box;
            line-height: 1.2;
        }
        /* Placed in the open sky/leaf area to avoid blocking the cat */
        .cat-line {
            top: 25px;
            left: 20px;
            text-align: left;
            width: 55%;
        }
        /* Placed in the lower right tree trunk/background area to avoid blocking the bird */
        .bird-line {
            bottom: 40px;
            right: 20px;
            text-align: right;
            width: 60%;
        }
        .meme-caption {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            margin-top: 15px;
            letter-spacing: 0.5px;
        }
        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: #888888;
        }
    </style>
</head>
